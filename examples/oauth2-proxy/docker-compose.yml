# The full setup with sign-in through your OpenID Connect provider (Google, Microsoft Entra,
# Keycloak, Authentik, Stalwart, ...): oauth2-proxy in front of craft-ai-hub, the craft apps and
# the craft-mcp relay behind it. Put TLS in front of oauth2-proxy (Caddy, Traefik, a load balancer).
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d
#
# Register https://<your host>/oauth2/callback as the redirect URI with your provider.
x-app: &app
  restart: unless-stopped

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    restart: unless-stopped
    ports: ["4180:4180"]
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${HUB_ORIGIN:?set HUB_ORIGIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_UPSTREAMS: http://hub:8080
      # Replies stream from the chat; don't hold them back.
      OAUTH2_PROXY_FLUSH_INTERVAL: 100ms
      # MCP clients (claude.ai, Claude Code) and the tab's WebSocket carry their own relay key.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: ^/_relay/,^/healthz$
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    depends_on: [hub]

  hub:
    image: hayone/craft-ai-hub:latest
    restart: unless-stopped
    environment:
      APPS: >-
        photocraft=http://photocraft:8080,vectorcraft=http://vectorcraft:8080,lightcraft=http://lightcraft:8080,
        filmcraft=http://filmcraft:8080,effectcraft=http://effectcraft:8080
      RELAY_URL: http://craft-mcp:8080
      MCP_KEY: ${MCP_KEY:?set MCP_KEY}
      PUBLIC_ORIGIN: ${HUB_ORIGIN:?set HUB_ORIGIN}
      CHAT_TOKENS: ${CHAT_TOKENS:-personal}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    depends_on: [craft-mcp]

  craft-mcp:
    image: hayone/craft-mcp:latest
    restart: unless-stopped
    environment:
      MCP_KEY: ${MCP_KEY:?set MCP_KEY}
      PUBLIC_HOST: ${HUB_ORIGIN:?set HUB_ORIGIN}/_relay

  photocraft: { <<: *app, image: "hayone/photocraft:remote" }
  vectorcraft: { <<: *app, image: "hayone/vectorcraft:remote" }
  lightcraft: { <<: *app, image: "hayone/lightcraft:remote" }
  filmcraft: { <<: *app, image: "hayone/filmcraft:remote" }
  effectcraft: { <<: *app, image: "hayone/effectcraft:remote" }
